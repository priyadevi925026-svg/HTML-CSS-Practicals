<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Scaling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .img-container {
            border: 2px dashed #0077b6;
            padding: 10px;
            max-width: 600px;
        }

        .responsive-img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Responsive Image Scaling</h1>
    <div class="img-container">
        <img src="images/banner.jpg" alt="Responsive scenery graphic" class="responsive-img">
    </div>
</body>
