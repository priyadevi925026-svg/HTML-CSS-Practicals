<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units Demo</title>
    <style>
        .box-fixed {
            width: 200px;
            height: 40px;
            background-color: #457b9d;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box-percent {
            width: 50%;
            height: 40px;
            background-color: #2a9d8f;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rem-text {
            font-size: 1.5rem;
            color: #1d3557;
        }
    </style>
</head>
<body>
    <div class="box-fixed">Fixed Width (200px)</div>
    <div class="box-percent">Half Width (50%)</div>
    <p class="rem-text">This paragraph is styled with a font size of 1.5rem.</p>
</body>
</html>
