<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables Demo</title>
    <style>
        :root {
            --main-color: #1d3557;
            --accent-color: #e63946;
            --page-padding: 20px;
        }

        body {
            color: var(--main-color);
            padding: var(--page-padding);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <h1>Heading Styled with Accent Color Variable</h1>
    <p>This paragraph text is styled with the main color variable (#1d3557), and the body uses the page padding variable (20px).</p>
</body>
