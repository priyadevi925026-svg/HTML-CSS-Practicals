<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow Scroll Box</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .scroll-box {
            height: 120px;
            overflow: auto;
            border: 2px solid #333;
            padding: 10px;
            width: 250px;
            background-color: #f4f4f4;
        }

        .scroll-box p {
            margin: 10px 0;
            padding: 5px;
            background-color: #e9ecef;
            border-left: 3px solid #007bff;
        }
    </style>
</head>
<body>
    <h1>Overflow Auto Scrolling Box</h1>
    <div class="scroll-box">
        <p>Line 1: Introduction to Web Design</p>
        <p>Line 2: Semantic HTML Elements</p>
        <p>Line 3: CSS Box Model Mechanics</p>
        <p>Line 4: Overflow and Scroll Handling</p>
        <p>Line 5: Practical Web Layouts</p>
    </div>
</body>
