<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card UI Component</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #0056b3;
            border-radius: 12px;
            padding: 16px;
            max-width: 320px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #0056b3;
        }

        .card p {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Web Development Card</h3>
        <p>This styled card features rounded corners with border-radius of 12px, 16px of internal padding, and a 2px blue border.</p>
    </div>
</body>
